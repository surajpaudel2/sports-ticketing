# =====================================================================
# EUREKA SERVER — DEVELOPMENT CONFIGURATION
# =====================================================================

eureka:
  server:
    # Disable self preservation in dev — services deregister cleanly on shutdown
    # In prod this should be true to protect against network issues
    enable-self-preservation: false

logging:
  level:
    com.netflix.eureka: DEBUG
    com.netflix.discovery: DEBUG
    org.springframework: INFO