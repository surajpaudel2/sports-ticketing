# =====================================================================
# EUREKA SERVER — DEFAULT CONFIGURATION
# Kept locally — does NOT fetch from Config Server.
# Must start first before any other service.
#
# Startup order:
#   1. Eureka Server  — starts first, no dependencies
#   2. Config Server  — starts second, registers with Eureka
#   3. Microservices  — start last, discover Config Server via Eureka
# =====================================================================

spring:
  application:
    name: eureka-server

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# =====================================================================
# EUREKA SERVER SETTINGS
# registerWithEureka: false — Eureka Server should not register itself
#                            with another Eureka instance
# fetchRegistry: false     — Eureka Server does not need to fetch
#                            registry from another Eureka instance
# Both false because this IS the registry
# =====================================================================
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    wait-time-in-ms-when-sync-empty: 0
    renewal-percent-threshold: 0.85

server:
  port: 8761

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always