# =====================================================================
# EUREKA SERVER — PRODUCTION CONFIGURATION
# TODO: Add production config when production environment is set up
# =====================================================================

eureka:
  instance:
    # In production use actual hostname or IP — not localhost
    hostname: ${EUREKA_HOSTNAME:localhost}
  server:
    enable-self-preservation: true
    renewal-percent-threshold: 0.85

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
