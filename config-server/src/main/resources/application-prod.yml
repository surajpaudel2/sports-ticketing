# =====================================================================
# CONFIG SERVER — PRODUCTION CONFIGURATION
# TODO: Add production config when production environment is set up
# =====================================================================

encrypt:
  key-store:
    location: classpath:configserver.jks
    password: ${KEY_STORE_PASSWORD}
    alias: configserver
    secret: ${KEY_STORE_SECRET}

eureka:
  instance:
    hostname: ${CONFIG_SERVER_HOSTNAME:localhost}
    prefer-ip-address: false

logging:
  level:
    org.springframework.cloud.config: WARN
    org.springframework.cloud.bus: WARN

# TODO: In production restrict management endpoints
management:
  endpoints:
    web:
      exposure:
        include: "health,info,refresh,bus-refresh,monitor"