# ============================================================
# docker-compose.base.yml
# Reusable service templates — referenced via `extends`
# ============================================================

services:

  # ──────────────────────────────────────────────
  # BASE: Any microservice that connects to config-server
  # ──────────────────────────────────────────────
  microservice-base:
    image: placeholder           # overridden in docker-compose.yml
    restart: on-failure
    networks:
      - sports-ticketing
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CONFIG_IMPORT: "optional:configserver:${CONFIG_SERVER_URL:-http://config-server:8888}"
      SPRING_CLOUD_CONFIG_URI: "${CONFIG_SERVER_URL:-http://config-server:8888}"
      # Retry: back off aggressively so services don't hammer config-server on startup
      SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS: "10"
      SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL: "2000"
      SPRING_CLOUD_CONFIG_RETRY_MAX_INTERVAL: "10000"
      SPRING_CLOUD_CONFIG_RETRY_MULTIPLIER: "1.5"
      SPRING_CLOUD_CONFIG_FAIL_FAST: "true"
      # RabbitMQ connection (both AMQP for messaging and HTTP for management/monitor)
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: "${RABBITMQ_USER:-guest}"
      SPRING_RABBITMQ_PASSWORD: "${RABBITMQ_PASS:-guest}"
      SPRING_RABBITMQ_VIRTUAL_HOST: "/"
      # Spring Cloud Bus uses the same AMQP connection
      SPRING_CLOUD_BUS_ENABLED: "true"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ──────────────────────────────────────────────
  # BASE: Config-server itself (lighter than microservices)
  # ──────────────────────────────────────────────
  config-server-base:
    image: placeholder
    restart: on-failure
    networks:
      - sports-ticketing
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: "${RABBITMQ_USER:-guest}"
      SPRING_RABBITMQ_PASSWORD: "${RABBITMQ_PASS:-guest}"
      SPRING_CLOUD_BUS_ENABLED: "true"
      # GitHub webhook monitor — increase timeouts for slow webhook deliveries
      SPRING_CLOUD_CONFIG_MONITOR_GITHUB_ENABLED: "true"
    deploy:
      resources:
        limits:
          memory: 384M # Config server will not allocate more than 384M, but it can use up to that if needed
          cpus: "0.50" # Config server will not use more than 50% of a CPU core, but it can use up to that if needed
        reservations:
          memory: 192M # Config server will reserve at least 192M, but it can use more if needed

networks:
  sports-ticketing:
    driver: bridge