spring:
  application:
    name: PAYMENT-SERVICE   # Must match the Eureka service name used in Feign clients (e.g. booking-service PaymentServiceClient)
  profiles:
    active: dev   # Switch to 'prod' for production — prod profile uses PostgreSQL (see application-prod.yaml or remove this line)

  # RabbitMQ connection — must be running locally or via Docker before starting this service
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # H2 in-memory database — used by the Outbox Pattern to persist OutboxEvent rows
  # before they are delivered to RabbitMQ by OutboxEventPoller.
  # Replace with a persistent datasource (e.g. PostgreSQL) for production deployments.
  datasource:
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop   # Recreates the schema on each restart — fine for dev; use validate/none in prod
    show-sql: false

  h2:
    console:
      enabled: true   # H2 web console available at http://localhost:8084/h2-console (dev only)

  # Enables Spring's @Scheduled task executor — required by OutboxEventPoller.
  # Actual scheduling is activated via @EnableScheduling on PaymentServiceApplication.
  scheduling:
    enabled: true

server:
  port: 8084   # Payment Service port — must not conflict with other services (Booking=8082, Event=8083, Eureka=8761)

# Eureka — registers this service so other services can discover it by name
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/   # Eureka Server URL
  instance:
    prefer-ip-address: true   # Use IP instead of hostname for service registration

# Swagger UI available at http://localhost:8084/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Stripe configuration
# NEVER hardcode these values — always inject via environment variables.
# stripe.secret-key    → set STRIPE_SECRET_KEY in your environment (sk_test_... for dev)
# stripe.webhook-secret → set STRIPE_WEBHOOK_SECRET in your environment (whsec_... from Stripe CLI or dashboard)
stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: whsec_6cd96fc49dfe6f9cc48af3ed6d1c07e686190b1d8a8a08ba964161f9117180bc
