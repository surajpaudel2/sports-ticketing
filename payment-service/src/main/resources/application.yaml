spring:
  application:
    name: PAYMENT-SERVICE   # Must match the Eureka service name used in Feign clients (e.g. booking-service PaymentServiceClient)

  # RabbitMQ connection — must be running locally or via Docker before starting this service
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8084   # Payment Service port — must not conflict with other services (Booking=8082, Event=8083, Eureka=8761)

# Eureka — registers this service so other services can discover it by name
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/   # Eureka Server URL
  instance:
    prefer-ip-address: true   # Use IP instead of hostname for service registration

# Swagger UI available at http://localhost:8084/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Stripe configuration
# NEVER hardcode these values — always inject via environment variables.
# stripe.secret-key    → set STRIPE_SECRET_KEY in your environment (sk_test_... for dev)
# stripe.webhook-secret → set STRIPE_WEBHOOK_SECRET in your environment (whsec_... from Stripe CLI or dashboard)
stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: whsec_6cd96fc49dfe6f9cc48af3ed6d1c07e686190b1d8a8a08ba964161f9117180bc
